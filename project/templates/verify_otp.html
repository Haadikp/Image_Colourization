<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageTone | Verify OTP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
<!--    <script defer src="{{ url_for('static', filename='otp_verification.js') }}"></script>-->
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="7.5 4.21 12 6.81 16.5 4.21"></polyline><polyline points="7.5 19.79 7.5 14.6 3 12"></polyline><polyline points="21 12 16.5 14.6 16.5 19.79"></polyline><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    <span>ImageTone</span>
                </div>
                <h1>Verify OTP</h1>
                <p>Enter the 6-digit OTP sent to your email.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=True) %}
              {% if messages %}
                <div class="alert-container">
                  {% for category, message in messages %}
                    <div class="alert {% if category == 'success' %}alert-success{% else %}alert-error{% endif %}">
                      <span class="alert-message">{{ message }}</span>
                      <button class="alert-close">&times;</button>
                    </div>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}




            <div class="step-indicator">
                <div class="step-dot "></div>
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
            </div>



            <form id="otp-form" class="auth-form" action="/verify_otp" method="POST">
                <div class="otp-inputs">
                    <input type="text" maxlength="1" pattern="[0-9]" required>
                    <input type="text" maxlength="1" pattern="[0-9]" required>
                    <input type="text" maxlength="1" pattern="[0-9]" required>
                    <input type="text" maxlength="1" pattern="[0-9]" required>
                    <input type="text" maxlength="1" pattern="[0-9]" required>
                    <input type="text" maxlength="1" pattern="[0-9]" required>
                </div>
                <input type="hidden" id="otp" name="otp">

                <button type="submit" class="btn btn-primary">Verify OTP</button>
            </form>

            <div class="auth-footer">
                <p>Didn't receive the code? <button type="button" class="resend-button" disabled>Resend OTP</button></p>
                <p>Resend OTP in <span id="countdown">60</span></p>
            </div>
        </div>
    </div>
<script>

    document.addEventListener("DOMContentLoaded", function () {
    const otpInputs = document.querySelectorAll(".otp-inputs input");
    const hiddenOtpInput = document.getElementById("otp");
    const otpForm = document.getElementById("otp-form");

    // Auto-focus next input when a digit is entered
    otpInputs.forEach((input, index) => {
        input.addEventListener("input", function () {
            if (this.value.length === 1 && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
            }
        });

        input.addEventListener("keydown", function (event) {
            if (event.key === "Backspace" && index > 0 && this.value.length === 0) {
                otpInputs[index - 1].focus();
            }
        });
    });

    // Before submitting, combine all OTP digits and store them in the hidden field
    otpForm.addEventListener("submit", function (event) {
        let otpValue = "";
        otpInputs.forEach(input => {
            otpValue += input.value;
        });

        if (otpValue.length !== 6) {
            event.preventDefault();
            alert("Please enter a 6-digit OTP.");
            return;
        }

        hiddenOtpInput.value = otpValue;
    });

    // Resend OTP Countdown
    let timeLeft = 60;
    const countdownElement = document.getElementById("countdown");
    const resendBtn = document.querySelector(".resend-button");

    const countdown = setInterval(() => {
        timeLeft--;
        countdownElement.textContent = `00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`;
        if (timeLeft === 0) {
            clearInterval(countdown);
            resendBtn.disabled = false;
        }
    }, 1000);
});

</script>
</body>
</html>
